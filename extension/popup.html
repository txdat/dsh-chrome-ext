<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DSH Web</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <img class="logo" src="icons/icon-32.png" alt="" width="18" height="18" />
      <h1>DSH Web</h1>
    </header>

    <p id="status" class="status">checking…</p>

    <div class="row">
      <button id="open" class="primary" type="button">Open dsh web</button>
      <button id="stop" type="button">Stop</button>
    </div>

    <details class="pane">
      <summary><span class="chev" aria-hidden="true"></span>Settings</summary>
      <div class="pane-body">
        <label class="field">
          <span class="field-label">Workspace</span>
          <input
            id="workspace"
            type="text"
            placeholder="~ (home directory)"
            spellcheck="false"
            autocomplete="off"
          />
          <span class="field-hint">Working directory the agent starts in.</span>
        </label>
        <label class="field">
          <span class="field-label">Port</span>
          <input id="port" type="number" min="1" max="65535" placeholder="3080" inputmode="numeric" />
          <span class="field-hint">Loopback port the web UI binds to. Default 3080.</span>
        </label>
        <label class="field">
          <span class="field-label">CLI version</span>
          <input id="version" type="text" placeholder="use the built-in pin" spellcheck="false" autocomplete="off" />
          <span class="field-hint">Exact <code>@deepseek-ai/dsh</code> version to run, e.g. 0.2.2-rc.1. A new version is installed once into <code>~/.local/share/dsh-chrome-ext/cli</code>, then launched from disk.</span>
        </label>
        <div class="pane-actions">
          <button id="reset" class="ghost" type="button">Reset to defaults</button>
        </div>
      </div>
    </details>

    <details id="details-pane" class="pane" hidden>
      <summary><span class="chev" aria-hidden="true"></span>Details</summary>
      <div class="pane-body">
        <dl id="details" class="kv"></dl>
      </div>
    </details>

    <p id="error" class="error" hidden></p>

    <script type="module" src="popup.js"></script>
  </body>
</html>
